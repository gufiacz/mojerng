<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d0d0d">
    <title>Moje RNG</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="currencyPanel">

        <button class="currency-button" id="coinsButton">
            <span class="currency-icon">🪙</span>

            <span class="currency-info">
                <span class="currency-name">COINS</span>
                <strong id="coinsValue">0</strong>
            </span>
        </button>

        <button class="currency-button" id="tokenButton">
            <span class="currency-icon">🃏</span>

            <span class="currency-info">
                <span class="currency-name">LARP TOKENS</span>
                <strong id="tokenValue">0</strong>
            </span>
        </button>

    </div>

    <div id="currencyGain"></div>

    <button id="resetButton">RESET</button>

    <button id="indexButton">INDEX</button>

    <aside id="upgradePanel">

        <div class="upgrade-header">
            <div class="upgrade-title">UPGRADES</div>

            <div class="upgrade-subtitle">
                Improve your stats
            </div>
        </div>

        <div class="upgrade-card">

            <div class="upgrade-card-top">

                <div class="upgrade-text">
                    <div class="upgrade-name">
                        XP Multiplier
                    </div>

                    <div class="upgrade-description">
                        Gain more XP from every achievement.
                    </div>
                </div>

                <div
                    class="upgrade-value"
                    id="xpMultiplierValue"
                >
                    1.0x
                </div>

            </div>

            <div class="upgrade-bottom">

                <span id="xpUpgradeCost">
                    2 COINS
                </span>

                <button id="xpUpgradeButton">
                    UPGRADE
                </button>

            </div>

        </div>

        <div class="upgrade-card">

            <div class="upgrade-card-top">

                <div class="upgrade-text">
                    <div class="upgrade-name">
                        Animation Speed
                    </div>

                    <div class="upgrade-description">
                        Make the roll animation faster.
                    </div>
                </div>

                <div
                    class="upgrade-value"
                    id="speedValue"
                >
                    1.0x
                </div>

            </div>

            <div class="upgrade-bottom">

                <span id="speedUpgradeCost">
                    2 COINS
                </span>

                <button id="speedUpgradeButton">
                    UPGRADE
                </button>

            </div>

        </div>

    </aside>

    <div id="upgradeStats">

        <div class="upgrade-stat">
            <span>XP</span>
            <strong id="statXP">1.0x</strong>
        </div>

        <div class="upgrade-stat">
            <span>SPEED</span>
            <strong id="statSpeed">1.0x</strong>
        </div>

    </div>

    <div id="indexOverlay">

        <div id="indexPanel">

            <div class="index-header">

                <div>
                    <h2>Achievement Index</h2>

                    <span id="indexStats">
                        0 / 0 Achievements Unlocked
                    </span>
                </div>

                <!-- TYLKO DODANY PRZYCISK REFRESH -->
                <div class="index-header-buttons">

                    <button id="refreshIndex">
                        ↻
                    </button>

                    <button id="closeIndex">
                        ×
                    </button>

                </div>

            </div>

            <div class="index-search-wrapper">

                <span class="search-icon">⌕</span>

                <input
                    type="text"
                    id="achievementSearch"
                    placeholder="Search achievements..."
                    autocomplete="off"
                >

            </div>

            <div id="indexList"></div>

        </div>

    </div>

    <main class="container">

        <h1>MOJE RNG</h1>

        <div class="stats">

            <div>
                <span>LEVEL</span>
                <strong id="level">1</strong>
            </div>

            <div>
                <span>XP</span>
                <strong id="xp">0 / 100</strong>
            </div>

        </div>

        <div class="xp-bar">
            <div id="xpFill"></div>
        </div>

        <div id="result">

            <span id="digit1" class="digit"></span>
            <span id="digit2" class="digit"></span>
            <span id="digit3" class="digit"></span>

        </div>

        <div id="rollRarity"></div>

        <div id="achievement"></div>

        <button id="rollButton">
            ROLL
        </button>

    </main>

    <div id="version">
        VERSION 1.2
    </div>

    <script src="script.js"></script>

</body>
</html>
